name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-linux:
    name: pytest (Linux)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb vlc fonts-dejavu-core python3-tk \
            libx11-6 libxext6 libxrender1 libxft2 libxss1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_INDIRECT: 1
        run: >
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          python -m pytest -q -m "not gui" --tb=short

  test-windows:
    name: pytest + build (Windows)
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Instalar VLC (libvlc para tests y PyInstaller)
        run: |
          choco install vlc -y --no-progress
          $vlc = 'C:\Program Files\VideoLAN\VLC'
          if (Test-Path $vlc) {
            echo $vlc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: pytest
        run: python -m pytest -q

      - name: Generar icono Windows
        run: |
          python -c "from PIL import Image; Image.open('img/icono.png').save('img/icono.ico', format='ICO', sizes=[(256,256),(48,48),(32,32),(16,16)])"

      - name: PyInstaller (kidneysm3u.exe)
        run: python -m PyInstaller --noconfirm --clean kidneysm3u.spec

      - name: Comprobar ejecutable
        run: |
          if (-not (Test-Path dist\kidneysm3u\kidneysm3u.exe)) {
            Write-Error 'No se generó dist\kidneysm3u\kidneysm3u.exe'
            exit 1
          }
          Get-Item dist\kidneysm3u\kidneysm3u.exe | Format-List FullName, Length
